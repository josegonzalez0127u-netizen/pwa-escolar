<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela Primaria Prof. José González Villaseñor</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; }
        .header-buttons { margin-top: 10px; }
        nav { display: flex; justify-content: space-around; background-color: #34495e; padding: 10px 0; position: sticky; top: 0; z-index: 100; }
        nav button { background: none; border: none; color: white; font-size: 12px; cursor: pointer; padding: 5px; }
        nav button.active { border-bottom: 2px solid #e74c3c; font-weight: bold; }
        .content-section { display: none; padding: 20px; }
        .active-section { display: block; }
        
        /* Estilo de la publicación */
        .publicacion { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .titulo-publicacion { font-size: 1.3em; font-weight: bold; color: #2c3e50; margin: 0 0 10px 0; } /* Título grande y negrita */
        
        /* Carrusel de imágenes */
        .carrusel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; border-radius: 5px; }
        .carrusel img { scroll-snap-align: center; min-width: 100%; height: auto; object-fit: contain; }
        
        .publicacion iframe { width: 100%; height: 250px; border: none; margin-top: 10px; border-radius: 5px; }
        .fecha-publicacion { font-size: 0.8em; color: #7f8c8d; margin-top: 10px; text-align: right; } /* Fecha abajo */
        .btn-custom { border:none; padding:8px 15px; border-radius:4px; cursor:pointer; color:white; margin: 0 5px; }
    </style>
</head>
<body>
    <header>
        <h2>Escuela Primaria<br>"Prof. José González Villaseñor"</h2>
        <div class="header-buttons">
            <button id="btn-install" onclick="instalarApp()" class="btn-custom" style="background:#2980b9; display:none;">Instalar App</button>
        </div>
    </header>
    <nav>
        <button onclick="showSection('inicio', this)" class="active">INICIO</button>
        <button onclick="showSection('escuela', this)">ESCUELA</button>
        <button onclick="showSection('docentes', this)">DOCENTES</button>
        <button onclick="showSection('avisos', this)">AVISOS</button>
        <button onclick="showSection('artisticas', this)">ARTISTICAS</button>
        <button onclick="showSection('valores', this)">VALORES</button>
    </nav>
    <div id="inicio" class="content-section active-section"><h2>Bienvenidos</h2><div id="lista-inicio"></div></div>
    <div id="escuela" class="content-section"><h2>Nuestra Escuela</h2><div id="lista-escuela"></div></div>
    <div id="docentes" class="content-section"><h2>Personal Docente</h2><div id="lista-docentes"></div></div>
    <div id="avisos" class="content-section"><h2>Avisos Importantes</h2><div id="lista-avisos"></div></div>
    <div id="artisticas" class="content-section"><h2>Actividades Artísticas</h2><div id="lista-artisticas"></div></div>
    <div id="valores" class="content-section"><h2>Valores</h2><div id="lista-valores"></div></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBC1z1-LWxPMExp2SmxZhIQFpL2cYjz9KM",
            authDomain: "pwa-escolar-7a9d2.firebaseapp.com",
            projectId: "pwa-escolar-7a9d2",
            storageBucket: "pwa-escolar-7a9d2.firebasestorage.app",
            messagingSenderId: "444090664948",
            appId: "1:444090664948:web:521b7ead26b987c2a79ba1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let deferredPrompt;

        function showSection(sectionId, buttonElement) {
            let sections = document.querySelectorAll('.content-section');
            sections.forEach(function(sec) { sec.classList.remove('active-section'); });
            document.getElementById(sectionId).classList.add('active-section');
            let buttons = document.querySelectorAll('nav button');
            buttons.forEach(function(btn) { btn.classList.remove('active'); });
            buttonElement.classList.add('active');
        }

        function extraerDriveId(url) {
            if(!url) return null;
            let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return match[1];
            match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return match[1];
            return null;
        }

        function cargarPublicaciones() {
            db.collection("publicaciones").orderBy("fecha", "desc").onSnapshot((querySnapshot) => {
                document.getElementById('lista-inicio').innerHTML = '';
                document.getElementById('lista-escuela').innerHTML = '';
                document.getElementById('lista-docentes').innerHTML = '';
                document.getElementById('lista-avisos').innerHTML = '';
                document.getElementById('lista-artisticas').innerHTML = '';
                document.getElementById('lista-valores').innerHTML = '';

                querySnapshot.forEach((doc) => {
                    const pub = doc.data();
                    
                    // Formatear fecha
                    let fechaStr = '';
                    if (pub.fecha) {
                        let date = pub.fecha.toDate();
                        fechaStr = date.toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    }

                    // Construir HTML de imágenes (Carrusel)
                    let imagenesHtml = '';
                    if(pub.imagenes) {
                        for(let i=1; i<=10; i++) {
                            let url = pub.imagenes['imagenUrl'+i];
                            if(url) {
                                let imgSrc = url;
                                let driveId = extraerDriveId(url);
                                if (driveId) imgSrc = `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
                                imagenesHtml += `<img src="${imgSrc}" alt="Imagen ${i}">`;
                            }
                        }
                        if(imagenesHtml !== '') {
                            imagenesHtml = `<div class="carrusel">${imagenesHtml}</div>`;
                        }
                    }

                    // Construir HTML de Video
                    let videoHtml = '';
                    if(pub.videoUrl) {
                        let videoSrc = pub.videoUrl;
                        let ytMatch = pub.videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([\w-]{11})/);
                        if (ytMatch && ytMatch[1]) videoSrc = `https://www.youtube.com/embed/${ytMatch[1]}`;
                        else {
                            let driveId = extraerDriveId(pub.videoUrl);
                            if (driveId) videoSrc = `https://drive.google.com/file/d/${driveId}/preview`;
                        }
                        videoHtml = `<iframe src="${videoSrc}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                    }

                    // Construir HTML de PDF
                    let pdfHtml = '';
                    if(pub.pdfUrl) {
                        let pdfSrc = pub.pdfUrl;
                        let driveId = extraerDriveId(pub.pdfUrl);
                        if (driveId) pdfSrc = `https://drive.google.com/file/d/${driveId}/preview`;
                        pdfHtml = `<iframe src="${pdfSrc}" style="height: 500px;"></iframe>`;
                    }

                    // Unir todo
                    let html = `
                        <div class="publicacion">
                            <p class="titulo-publicacion">${pub.texto}</p>
                            ${imagenesHtml}
                            ${videoHtml}
                            ${pdfHtml}
                            <div class="fecha-publicacion">Publicado: ${fechaStr}</div>
                        </div>`;

                    if(pub.seccion === 'inicio') document.getElementById('lista-inicio').innerHTML += html;
                    else if(pub.seccion === 'escuela') document.getElementById('lista-escuela').innerHTML += html;
                    else if(pub.seccion === 'docentes') document.getElementById('lista-docentes').innerHTML += html;
                    else if(pub.seccion === 'avisos') document.getElementById('lista-avisos').innerHTML += html;
                    else if(pub.seccion === 'artisticas') document.getElementById('lista-artisticas').innerHTML += html;
                    else if(pub.seccion === 'valores') document.getElementById('lista-valores').innerHTML += html;
                });
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(function(registration) { console.log('ServiceWorker registrado'); })
                    .catch(function(err) { console.log('Error ServiceWorker: ', err); });
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btn-install').style.display = 'inline-block';
        });

        function instalarApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') document.getElementById('btn-install').style.display = 'none';
                    deferredPrompt = null;
                });
            } else {
                alert("Ve al menú de tu navegador (tres puntitos) y selecciona 'Instalar aplicación'.");
            }
        }

        window.onload = function() {
            cargarPublicaciones();
        };
    </script>
</body>
</html>
